version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres_catalogo
    environment:
      POSTGRES_USER: catalogo_user
      POSTGRES_PASSWORD: catalogo_pass
      POSTGRES_DB: catalogo_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - mynet
